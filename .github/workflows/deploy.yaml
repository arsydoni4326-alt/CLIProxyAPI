name: Build and Push Docker Image

on:
  push:
    branches:
      - main  # Triggers the workflow when code is pushed to the main branch

env:
  REGISTRY: ghcr.io
  # Converts the repository name to lowercase to prevent GHCR formatting errors
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    # Required permissions to write packages to GHCR
    permissions:
      contents: read
      packages: write

    steps:
      # Step 1: Check out the source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # QEMU is required to emulate the arm64 architecture on the x86 runner
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Step 2: Set up Docker Buildx (enables caching and multi-platform builds)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Log in to the GitHub Container Registry
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 4: Extract metadata (tags, labels) from Git events
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      # Step 5: Build the Dockerfile and push it to GHCR
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          dockerfile: ./Dockerfile-ghcr
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
