services:
  cli-proxy-api:
    # Default to this fork's own image: it is built from ./Dockerfile on every push to
    # main and carries the fork-specific fixes listed in
    # docs/MERGE-PRESERVATION-fork-fixes.md — including the graceful RESP error that
    # stops cpa-usage-keeper from reporting "connection reset by peer".
    # Set CLI_PROXY_IMAGE=eceasy/cli-proxy-api:latest to run the upstream image instead,
    # or run `docker compose up --build` to build ./Dockerfile locally.
    image: ${CLI_PROXY_IMAGE:-ghcr.io/arsydoni4326-alt/cliproxyapi:latest}
    pull_policy: always
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: cli-proxy-api
    # env_file:
    #   - .env
    environment:
      DEPLOY: ${DEPLOY:-}
    # ports:
    #   - "8317:8317"
    #   - "8085:8085"
    #   - "1455:1455"
    #   - "54545:54545"
    #   - "51121:51121"
    #   - "11451:11451"
    network_mode: host
    volumes:
      - ${CLI_PROXY_CONFIG_PATH:-./config.yaml}:/CLIProxyAPI/config.yaml
      - ${CLI_PROXY_AUTH_PATH:-./auths}:/root/.cli-proxy-api
      - ${CLI_PROXY_LOG_PATH:-./logs}:/CLIProxyAPI/logs
      - ${CLI_PROXY_PLUGIN_PATH:-./plugins}:/CLIProxyAPI/plugins
      # Management panel (management.html) is NOT baked into the image. The server
      # auto-downloads it on first access to /management.html (and refreshes it every
      # 3h) into /CLIProxyAPI/static/ inside the container. Mount the directory below
      # to (a) persist that download across container recreates and (b) let you pin a
      # specific panel by placing your own management.html into ./static on the host
      # (air-gapped / version-pinning; set remote-management.disable-auto-update-panel:
      # true in config.yaml to keep the pinned copy from being refreshed). The
      # directory must be mounted (not the file) so the auto-updater can atomically
      # replace the asset.
      - ${CLI_PROXY_STATIC_PATH:-./static}:/CLIProxyAPI/static
    restart: unless-stopped

